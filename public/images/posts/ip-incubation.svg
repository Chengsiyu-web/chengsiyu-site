<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="身份卡片抽卡组合成人设">
  <rect width="1600" height="900" fill="#f7f4ef"/>
  <g fill="none" stroke="#2b2622" stroke-width="3">
    <!-- connection lines between cards -->
    <path d="M640 430 L800 360 L960 430" stroke-dasharray="2 10" opacity=".45"/>
    <path d="M640 430 L800 520 L960 430" stroke-dasharray="2 10" opacity=".45"/>
    <path d="M640 430 L960 430" stroke-dasharray="2 10" opacity=".3"/>
    <!-- fanned cards, back to front -->
    <g transform="rotate(-18 560 620)">
      <rect x="480" y="480" width="180" height="250" rx="10" fill="#f7f4ef"/>
      <circle cx="570" cy="560" r="26"/>
      <line x1="530" y1="630" x2="610" y2="630"/>
      <line x1="545" y1="660" x2="595" y2="660"/>
    </g>
    <g transform="rotate(-9 700 620)">
      <rect x="620" y="470" width="180" height="250" rx="10" fill="#f7f4ef"/>
      <line x1="660" y1="530" x2="760" y2="530"/>
      <line x1="660" y1="565" x2="740" y2="565"/>
      <line x1="660" y1="600" x2="760" y2="600"/>
    </g>
    <!-- center raised card, accent -->
    <g transform="rotate(0 830 600)">
      <rect x="740" y="450" width="190" height="265" rx="10" fill="#e9c8bf"/>
      <circle cx="835" cy="545" r="34"/>
      <path d="M785 655 q50 -55 100 0"/>
    </g>
    <g transform="rotate(9 960 620)">
      <rect x="880" y="470" width="180" height="250" rx="10" fill="#f7f4ef"/>
      <rect x="920" y="520" width="100" height="100" rx="8"/>
      <line x1="945" y1="570" x2="995" y2="570"/>
    </g>
    <g transform="rotate(18 1100 620)">
      <rect x="1020" y="480" width="180" height="250" rx="10" fill="#f7f4ef"/>
      <path d="M1060 560 q50 -40 100 0"/>
      <circle cx="1110" cy="620" r="20"/>
    </g>
  </g>
  <circle cx="800" cy="220" r="7" fill="#cf7f74"/>
  <circle cx="1100" cy="260" r="5" fill="#2b2622" opacity=".5"/>
  <circle cx="520" cy="250" r="5" fill="#2b2622" opacity=".5"/>
</svg>
